      animation: shake 0.25s ease-in-out;

  <script>

    // ======================================================
    // 1. SOUND SYSTEM
    // ======================================================

    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {

      if (!soundEnabled) return;

      initAudio();

      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'punch') {

        osc.type = 'triangle';

        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(
          30,
          now + 0.12
        );

        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(
          0.01,
          now + 0.12
        );

        osc.start(now);
        osc.stop(now + 0.12);

      } else if (type === 'kick') {

        osc.type = 'sine';

        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(
          40,
          now + 0.18
        );

        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(
          0.01,
          now + 0.18
        );

        osc.start(now);
        osc.stop(now + 0.18);

      } else if (type === 'break') {

        osc.type = 'square';

        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(
          70,
          now + 0.25
        );

        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(
          0.01,
          now + 0.25
        );

        osc.start(now);
        osc.stop(now + 0.25);

      } else if (type === 'win') {

        osc.type = 'sine';

        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(400, now + 0.1);
        osc.frequency.setValueAtTime(500, now + 0.2);
        osc.frequency.setValueAtTime(700, now + 0.35);

        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(
          0.01,
          now + 0.5
        );

        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    function toggleSound() {

      soundEnabled = !soundEnabled;

      document.getElementById('btn-sound').innerText =
        soundEnabled ? '🔊' : '🔇';
    }


    // ======================================================

    let combo = 0;

    let selectedCharKey = 'kenji';

    const characters = {

    const enemies = [

        avatar: "🥷"
      },

        speaker: "Pemain",
        text:
          "Hei! Kembalikan tas dan dompetku! Aku tidak akan membiarkanmu melepaskan pencopet sepertimu!",
        avatar: "PLAYER"
      },

      {
        speaker: "Pencopet",
        text:
          "Hahaha! Memangnya kamu bisa apa, anak kecil? Serahkan saja semuanya atau kamu ku-serang!",
        avatar: "🥷"

    ];


    // ======================================================
    // SCORE & COMBO
    // ======================================================

    function addScore(pts) {

      totalScore += pts;

      const scoreElement =
        document.getElementById('global-score');

      if (scoreElement) {
        scoreElement.innerText = totalScore;
      }
    }


    function addCombo() {

      combo++;

      const badge =
        document.getElementById('combo-badge');

      if (combo >= 2) {

        badge.classList.remove('hidden');

        document.getElementById('combo-count').innerText =
          `${combo}x`;
      }
    }


    function resetCombo() {

      combo = 0;

      const badge =
        document.getElementById('combo-badge');

      if (badge) {
        badge.classList.add('hidden');
      }
    }


    // ======================================================
    // 4. PILIH KARAKTER
    // ======================================================

    function showCharSelect() {

      clearInterval(boardInterval);

      resetCombo();

        .getElementById('timer-box')
        .classList.add('hidden');

      const screen =
        document.getElementById('game-screen');

                selectedCharKey === 'mei'
                  ? 'border-amber-500 bg-amber-100 scale-105 shadow-xl'
                  : 'border-amber-200'
              } bounce-btn flex flex-col items-center"

              <span class="text-6xl mb-2">
                👧🥋
              </span>

          <button

    function selectChar(key) {

      selectedCharKey = key;

      playSound('punch');

      showCharSelect();
    }


    // ======================================================
    // 5. MENU UTAMA
    // ======================================================

    function showMenu() {

      clearInterval(boardInterval);

      resetCombo();

      document
        .getElementById('timer-box')
        .classList.add('hidden');

      const screen =
        document.getElementById('game-screen');

      const char =
        characters[selectedCharKey];

      screen.innerHTML = `

        <div class="text-center w-full max-w-sm animate-pop">

          <div
            class="bg-white/80 backdrop-blur p-3 rounded-2xl border-2 border-amber-300 mb-6 flex items-center justify-between"
          >

            <div class="flex items-center gap-3">

              <span class="text-4xl">
                ${char.avatar}
              </span>

              <div class="text-left">

                <div class="font-bold text-amber-900">
                  ${char.name}
                </div>

                <div class="text-xs text-amber-600">
                  Pendekar Siap Berlatih
                </div>

              </div>

            </div>


            <button
              onclick="showCharSelect()"
              class="text-xs bg-amber-200 text-amber-800 px-3 py-1.5 rounded-xl font-bold border border-amber-400 bounce-btn"
            >

          </div>


          <h2 class="text-2xl font-bold text-amber-900 mb-4">
            Pilih Mode Permainan
          </h2>


          <div class="flex flex-col gap-3">

            <button
              onclick="startStoryMode()"
              class="bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold py-3.5 px-6 rounded-2xl border-b-4 border-red-800 shadow-lg bounce-btn flex items-center justify-between text-lg"
            >

              <span>
                🥷 Petualangan Drama
              </span>

            >

              <span>

      `;
    }


    // ======================================================
    // 6. STORY MODE
    // ======================================================

    function startStoryMode() {

      storyStep = 0;

      renderStoryScreen();
    }


    function renderStoryScreen() {

      const screen =
        document.getElementById('game-screen');

      const char =
        characters[selectedCharKey];

      if (storyStep < storyDialogs.length) {

        const currentDialog =
          storyDialogs[storyStep];

        let displayAvatar =
          currentDialog.avatar;

        let speakerName =
          currentDialog.speaker;


        if (displayAvatar === "PLAYER") {

          displayAvatar =
            char.avatar;

          speakerName =
            char.name;
        }


        screen.innerHTML = `

          <div
            class="w-full h-full flex flex-col justify-between items-center py-2 animate-pop"
          >

            <div
              class="bg-amber-100 border-2 border-amber-400 px-4 py-1.5 rounded-full font-bold text-amber-900 text-sm mb-2"
            >
              📖 Drama: Kejadian di Pasar
            </div>


            <div
              class="w-full flex-1 bg-gradient-to-b from-orange-200 to-amber-100 rounded-2xl border-4 border-white shadow-inner flex flex-col items-center justify-center p-4 relative"
            >

              <div class="text-8xl mb-2 animate-bounce">
                ${displayAvatar}
              </div>

              <div
                class="font-extrabold text-amber-900 text-lg bg-white/70 px-4 py-1 rounded-xl shadow-sm"

                ${speakerName}
              </div>

            </div>


            <div
              class="w-full bg-white p-4 rounded-2xl border-4 border-amber-400 shadow-md my-3 min-h-[110px] flex flex-col justify-between"
            >

              <p
                class="text-amber-900 text-base font-semibold leading-snug"
              >
                "${currentDialog.text}"
              </p>

            </div>


            <button
              onclick="nextStoryStep()"
              class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-extrabold text-lg py-3 rounded-2xl border-b-4 border-orange-700 shadow-lg bounce-btn"
            >
              Lanjut ➡️
            </button>

          </div>
        `;

      } else {

        screen.innerHTML = `

          <div
            class="w-full h-full flex flex-col justify-between items-center py-2 animate-pop"
          >

            <div
              class="bg-red-100 border-2 border-red-400 px-4 py-1.5 rounded-full font-bold text-red-900 text-sm mb-2"
            >
              ⚡ BAHAYA! Pencopet Mendekat!
            </div>


            <div
              class="w-full flex-1 bg-gradient-to-b from-red-200 to-amber-100 rounded-2xl border-4 border-white shadow-inner flex flex-col items-center justify-center p-4"
            >

              <div class="flex gap-4 text-7xl mb-4">

                <span>
                  ${char.avatar}
                </span>

                <span class="animate-pulse">
                  ⚔️
                </span>

                <span>
                  🥷
                </span>

              </div>


              <h3
                class="text-xl font-extrabold text-red-900 text-center"
              >
                Apa yang akan kamu lakukan untuk mempertahankan diri?
              </h3>

            </div>


            <div class="w-full flex flex-col gap-3 my-3">

              <button
                onclick="startBattleMode()"
                class="w-full bg-gradient-to-r from-red-500 to-rose-600 text-white font-extrabold text-lg py-3.5 rounded-2xl border-b-4 border-red-800 shadow-lg bounce-btn"
              >
                🥋 Keluarkan Jurus Silat & Bertarung!
              </button>


              <button
                onclick="showMenu()"
                class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 rounded-2xl border-b-4 border-gray-400 shadow-md bounce-btn text-sm"
              >
                🏃 Lari dan Minta Tolong (Kembali)
              </button>

            </div>

          </div>
        `;
      }
    }


    function nextStoryStep() {

      playSound('punch');

      storyStep++;

      renderStoryScreen();
    }


    // ======================================================
    // 7. BATTLE MODE
    // ======================================================

    function startBattleMode() {

      currentEnemyIndex = 0;

      setupEnemy();

      renderBattleScreen();
    }


    function setupEnemy() {

      const e =
        enemies[currentEnemyIndex % enemies.length];

      enemyMaxHp =
        e.hp +
        (Math.floor(currentEnemyIndex / enemies.length) * 40);

      enemyCurrentHp =
        enemyMaxHp;
    }


    function renderBattleScreen() {

      const screen =
        document.getElementById('game-screen');

      const char =
        characters[selectedCharKey];

      const enemy =
        enemies[currentEnemyIndex % enemies.length];


      screen.innerHTML = `

        <div
          class="w-full h-full flex flex-col justify-between items-center py-2 animate-pop"
        >

          <div
            class="w-full bg-white/90 p-3 rounded-2xl border-2 border-amber-300 shadow-sm"
          >

            <div
              class="flex justify-between text-sm font-bold text-amber-900 mb-1"
            >

              <span>
                Musuh: ${enemy.name}
              </span>

              <span id="hp-num">
                ${enemyCurrentHp} / ${enemyMaxHp} HP
              </span>

            </div>


            <div
              class="w-full bg-gray-200 h-5 rounded-full border-2 border-amber-400 overflow-hidden"
            >

              <div
                id="hp-bar"
                class="bg-red-500 h-full transition-all duration-200"
                style="width: ${(enemyCurrentHp / enemyMaxHp) * 100}%"
              ></div>

            </div>

          </div>


          <div
            id="arena"
            class="w-full flex-1 my-3 bg-gradient-to-b from-sky-300 to-emerald-200 rounded-2xl border-4 border-white shadow-inner relative flex justify-around items-end pb-6 overflow-hidden"
          >

            <div
              id="player-sprite"
              class="text-7xl sm:text-8xl transition-transform duration-150"
            >
              ${char.avatar}
            </div>


            <div
              id="enemy-sprite"
              class="text-7xl sm:text-8xl transition-transform duration-150"
            >
              ${enemy.avatar}
            </div>

          </div>


          <div class="w-full grid grid-cols-2 gap-3">

            <button
              onclick="attackEnemy('punch')"
              class="bg-gradient-to-r from-red-500 to-rose-500 text-white font-extrabold text-xl py-3.5 rounded-2xl border-b-4 border-red-700 shadow-lg bounce-btn active:scale-95"
            >
              👊 PUKUL!
            </button>


            <button
              onclick="attackEnemy('kick')"
              class="bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold text-xl py-3.5 rounded-2xl border-b-4 border-orange-700 shadow-lg bounce-btn active:scale-95"
            >
              🦶 TENDANG!
            </button>

          </div>

        </div>
      `;
    }


    function attackEnemy(type) {

      const pSprite =
        document.getElementById('player-sprite');

      const eSprite =
        document.getElementById('enemy-sprite');

      if (!pSprite || !eSprite) return;


      pSprite.classList.add(
        'translate-x-8',
        'scale-110'
      );

      setTimeout(() => {

        pSprite.classList.remove(
          'translate-x-8',
          'scale-110'
        );

      }, 150);


      playSound(type);


      const damage =
        type === 'punch' ? 15 : 22;

      enemyCurrentHp -= damage;

      if (enemyCurrentHp < 0) {
        enemyCurrentHp = 0;
      }


      addCombo();

      addScore(10 + combo * 2);


      eSprite.classList.add('animate-shake');

      setTimeout(() => {

        eSprite.classList.remove('animate-shake');

      }, 250);


      spawnDamageText(
        type === 'punch'
          ? `👊 -${damage}`
          : `🦶 -${damage}`
      );


      const hpBar =
        document.getElementById('hp-bar');

      const hpNum =
        document.getElementById('hp-num');


      if (hpBar) {

        hpBar.style.width =
          `${(enemyCurrentHp / enemyMaxHp) * 100}%`;
      }


      if (hpNum) {

        hpNum.innerText =
          `${enemyCurrentHp} / ${enemyMaxHp} HP`;
      }


      if (enemyCurrentHp <= 0) {

        playSound('win');

        setTimeout(() => {

          currentEnemyIndex++;

          setupEnemy();

          renderBattleScreen();

        }, 500);
      }
    }


    function spawnDamageText(txt) {

      const arena =
        document.getElementById('arena');

      if (!arena) return;


      const el =
        document.createElement('div');

      el.className =
        'damage-text text-xl sm:text-2xl';

      el.innerText = txt;

      el.style.right = '20%';
      el.style.bottom = '40%';

      arena.appendChild(el);


      setTimeout(() => {

        el.remove();

      }, 600);
    }


    // ======================================================
    // 8. MODE PUKUL PAPAN
    // ======================================================

    let boardScore = 0;
    let boardMisses = 0;

    const MAX_BOARD_MISSES = 3;


    function resetBoardGame() {

      boardScore = 0;
      boardMisses = 0;

      clearInterval(boardInterval);

      boardInterval = null;

      totalScore = 0;

      combo = 0;

      document.getElementById('global-score').innerText = '0';

      resetCombo();
    }


    function updateBoardScore() {

      boardScore =
        Math.max(0, boardScore);

      const scoreElement =
        document.getElementById('global-score');

      if (scoreElement) {

        scoreElement.innerText =
          boardScore;
      }
    }


    function startBoardBreakMode() {

      // RESET TOTAL MODE PUKUL PAPAN
      resetBoardGame();


      const screen =
        document.getElementById('game-screen');

      const char =
        characters[selectedCharKey];


      screen.innerHTML = `

        <div
          class="w-full h-full flex flex-col items-center justify-between py-2 animate-pop"
        >

          <!-- HEADER GAME -->
          <div class="w-full text-center">

            <div
              class="text-center font-bold text-amber-900 text-lg"
            >
              🪵 Ketuk saat indikator tepat di area HIJAU!
            </div>


            <div
              class="mt-2 bg-white/80 border-2 border-amber-300 rounded-xl px-3 py-2"
            >

              <div class="text-sm font-bold text-gray-700">
                Kesalahan:
              </div>

              <div
                id="board-misses"
                class="text-red-500 font-extrabold text-lg"
              >
                0/3
              </div>

            </div>

          </div>


          <!-- CHARACTER -->
          <div
            class="text-7xl my-2"
            id="board-char"
          >
            ${char.avatar}
          </div>


          <!-- BOARD -->
          <div
            id="board-target"
            class="w-48 h-28 bg-amber-800 border-4 border-amber-950 rounded-2xl flex items-center justify-center text-amber-100 text-2xl font-bold shadow-2xl my-2"
          >
            🪵 PAPAN 🪵
          </div>


          <!-- TIMING BAR -->
          <div
            class="w-full max-w-xs bg-gray-300 h-8 rounded-full border-4 border-amber-400 relative overflow-hidden shadow-inner my-2"
          >

            <!-- TARGET HIJAU -->
            <div
              class="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-1/4 bg-green-500 border-x-2 border-green-700"
            ></div>


            <!-- INDIKATOR -->
            <div
              id="board-indicator"
              class="absolute top-0 bottom-0 w-3 bg-red-600 rounded-full shadow-md"
              style="left: 0%;"
            ></div>

          </div>


          <!-- BUTTON -->
          <button
            onclick="hitBoard()"
            class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white font-extrabold text-2xl py-4 rounded-3xl border-b-4 border-green-800 shadow-xl bounce-btn active:scale-95 mt-2"
          >
            🥋 PUKUL PAPAN!
          </button>

        </div>
      `;


      boardPos = 0;

      boardDir = 2.5;


      clearInterval(boardInterval);


      boardInterval =
        setInterval(() => {

          boardPos += boardDir;


          if (
            boardPos >= 94 ||
            boardPos <= 0
          ) {

            boardDir *= -1;
          }


          const ind =
            document.getElementById(
              'board-indicator'
            );


          if (ind) {

            ind.style.left =
              `${boardPos}%`;
          }

        }, 20);
    }


    // ======================================================
    // HIT BOARD
    // ======================================================

    function hitBoard() {

      // Kalau game sudah selesai,
      // tombol tidak boleh melakukan apa-apa.
      if (!boardInterval) {
        return;
      }


      const board =
        document.getElementById('board-target');


      // SWEET SPOT
      if (
        boardPos >= 37.5 &&
        boardPos <= 62.5
      ) {

        // ==============================
        // TEPAT
        // ==============================

        playSound('break');

        addCombo();


        const earnedScore =
          50 + combo * 10;


        boardScore += earnedScore;


        updateBoardScore();


        if (board) {

          board.classList.add(
            'animate-shake'
          );

          board.innerText =
            `💥 +${earnedScore}!`;

          board.classList.replace(
            'bg-amber-800',
            'bg-amber-600'
          );
        }


        setTimeout(() => {

          if (board) {

            board.classList.remove(
              'animate-shake'
            );

            board.innerText =
              '🪵 PAPAN 🪵';

            board.classList.replace(
              'bg-amber-600',
              'bg-amber-800'
            );
          }

        }, 400);


      } else {

        // ==============================
        // MELESET
        // ==============================

        playSound('punch');

        resetCombo();


        boardMisses++;


        const missElement =
          document.getElementById(
            'board-misses'
          );


        if (missElement) {

          missElement.innerText =
            `${boardMisses}/3`;

          if (boardMisses === 1) {

            missElement.className =
              'text-yellow-500 font-extrabold text-lg';

          } else if (boardMisses === 2) {

            missElement.className =
              'text-orange-500 font-extrabold text-lg';

          } else {

            missElement.className =
              'text-red-600 font-extrabold text-lg';
          }
        }


        if (board) {

          board.classList.add(
            'animate-shake'
          );

          board.innerText =
            `❌ MELESET! ${boardMisses}/3`;

          setTimeout(() => {

            if (board) {

              board.classList.remove(
                'animate-shake'
              );

              board.innerText =
                '🪵 PAPAN 🪵';
            }

          }, 400);
        }


        // ==========================================
        // 3 KALI MELESET = GAME OVER
        // ==========================================

        if (
          boardMisses >= MAX_BOARD_MISSES
        ) {

          gameOverBoard();
        }
      }
    }


    // ======================================================
    // GAME OVER PUKUL PAPAN
    // ======================================================

    function gameOverBoard() {

      clearInterval(boardInterval);

      boardInterval = null;


      playSound('punch');


      const screen =
        document.getElementById('game-screen');


      screen.innerHTML = `

        <div
          class="w-full h-full flex flex-col items-center justify-center text-center animate-pop"
        >

          <div
            class="text-7xl mb-4"
          >
            💥
          </div>


          <h1
            class="text-4xl font-extrabold text-red-600 mb-2"
          >
            GAME OVER
          </h1>


          <p
            class="text-amber-900 font-bold text-lg mb-2"
          >
            Kamu melakukan 3 kesalahan!
          </p>


          <div
            class="bg-white border-4 border-amber-400 rounded-3xl shadow-xl px-8 py-5 mb-6"
          >

            <div
              class="text-sm text-gray-500 font-bold uppercase"
            >
              Skor Akhir
            </div>


            <div
              class="text-5xl font-extrabold text-amber-600"
            >
              ${boardScore}
            </div>

          </div>


          <div
            class="w-full flex flex-col gap-3"
          >

            <button
              onclick="startBoardBreakMode()"
              class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white font-extrabold text-xl py-3.5 rounded-2xl border-b-4 border-green-800 shadow-lg bounce-btn"
            >
              🔄 MAIN LAGI
            </button>


            <button
              onclick="showMenu()"
              class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-2xl border-b-4 border-gray-400 shadow-md bounce-btn"
            >
              🏠 MENU UTAMA
            </button>

          </div>

        </div>
      `;
    }


    // ======================================================
    // INITIALIZE APP
    // ======================================================

    window.onload = function() {

      showCharSelect();

    };

  </script>

</body>
</html>
